<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">MPMS summary to Origin: cloud preparation and local handoff</title>
  <desc id="desc">Uploaded summary DAT is inspected, user confirms moment column, X, mass or raw and optional record ranges, then conversion produces workbook, CSV, source mapping, manifest, preview and OGS. Origin is a separate local handoff with receiver status pending.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 Z" fill="#527383"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#17394a} .head{font-size:28px;font-weight:700}.sub{font-size:15px;fill:#526e7b}.label{font-size:18px;font-weight:700}.body{font-size:15px}.tag{font-size:13px;font-weight:700;fill:#895015}.box{fill:#fff;stroke:#bdd0d9;stroke-width:1.5}.flow{fill:none;stroke:#527383;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1120" height="580" rx="20" fill="#f3f7f9"/>
  <text x="42" y="54" class="head">MPMS summary → traceable Origin handoff</text>
  <text x="42" y="81" class="sub">Independent Python workflow · source records retained · each curve keeps its own X</text>
  <rect x="30" y="108" width="1060" height="325" rx="16" fill="#e6f0f2"/>
  <text x="48" y="135" class="tag">CHATGPT WORK EXECUTION ENVIRONMENT</text>
  <rect x="50" y="166" width="190" height="164" rx="12" class="box"/>
  <text x="68" y="197" class="label">Summary DAT upload</text>
  <text x="68" y="228" class="body">Actual headers + units</text>
  <text x="68" y="253" class="body">Acquisition records</text>
  <text x="68" y="278" class="body">SHA-256 source identity</text>
  <text x="68" y="308" class="sub">Raw .rw.dat excluded</text>
  <path d="M240 245 H276" class="flow"/>
  <rect x="280" y="166" width="222" height="164" rx="12" class="box"/>
  <text x="298" y="197" class="label">Inspect + user choices</text>
  <text x="298" y="228" class="body">Moment column and X</text>
  <text x="298" y="253" class="body">Explicit mass in mg or raw</text>
  <text x="298" y="278" class="body">Optional record ranges</text>
  <text x="298" y="308" class="sub">Ambiguities stay visible</text>
  <path d="M502 245 H538" class="flow"/>
  <rect x="542" y="166" width="190" height="164" rx="12" class="box"/>
  <text x="560" y="197" class="label">Convert</text>
  <text x="560" y="228" class="body">Original row order</text>
  <text x="560" y="253" class="body">Independent curve X/Y</text>
  <text x="560" y="278" class="body">Retained invalid records</text>
  <text x="560" y="308" class="sub">New output directory</text>
  <path d="M732 245 H768" class="flow"/>
  <rect x="772" y="153" width="296" height="190" rx="12" class="box"/>
  <text x="790" y="184" class="label">Reviewable bundle</text>
  <text x="790" y="215" class="body">XLSX + per-curve CSV</text>
  <text x="790" y="240" class="body">Source-row mapping + manifest</text>
  <text x="790" y="265" class="body">PNG preview + Origin OGS</text>
  <text x="790" y="290" class="body">Recorded units, scaling and hashes</text>
  <text x="790" y="321" class="sub">Attach files / download full ZIP</text>
  <text x="52" y="386" class="body">Python standard library for inspection · openpyxl + Matplotlib for conversion</text>
  <text x="52" y="411" class="sub">No experiment labels, fits, background corrections or universal quality thresholds are inferred.</text>
  <path d="M920 343 V466" class="flow"/>
  <rect x="50" y="461" width="650" height="85" rx="12" fill="#fff6e8" stroke="#e4ca9e"/>
  <text x="68" y="492" class="label">Receiver verification remains pending</text>
  <text x="68" y="520" class="body">Work import/activation and real Origin execution need recipient evidence.</text>
  <rect x="772" y="472" width="296" height="74" rx="12" class="box"/>
  <text x="790" y="501" class="label">Local Origin handoff</text>
  <text x="790" y="527" class="body">CSV Data Connector + line plots</text>
</svg>
